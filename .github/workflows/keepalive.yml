# .github/workflows/keepalive.yml
# Runs keepalive.mjs every 4 days. Uses the same supabase-js client and anon key
# as index.html, so there is nothing extra to configure.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 13 */4 * *'   # every 4 days at 13:17 UTC
  workflow_dispatch:           # run by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install supabase-js
        run: npm install @supabase/supabase-js@2 --no-save

      - name: Ping
        run: node keepalive.mjs
